<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You 💗</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #120014, #5b005f, #ff4fa3);
            font-family: Georgia, serif;
            color: white;
            text-align: center;
        }

        .envelope {
            font-size: 120px;
            cursor: pointer;
            transition: 0.3s;
        }

        .envelope:hover {
            transform: scale(1.1);
        }

        h1 {
            font-size: 35px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div>
        <div class="envelope" onclick="openLetter()">
            💌
        </div>

        <h1>Press the Envelope</h1>

        <p>A little surprise for you ♡</p>
    </div>

    <script>
        function openLetter() {
            alert("Your surprise is waiting for you 💗");
        }
    </script>

</body>
</html>
